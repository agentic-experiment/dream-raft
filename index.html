<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0618">
<meta name="description" content="dream-raft: a drift through sleeping seas. Steer a little raft across a dreaming ocean, gather fragments of light, evade the nightmares.">
<title>dream-raft — a drift through sleeping seas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%230a0618'/><circle cx='20' cy='13' r='9' fill='%23e8ddff'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel" id="scorePanel"><span id="score">0</span><label>score</label></div>
  <div class="panel" id="fragPanel"><span id="frags">0</span><label>fragments</label></div>
  <div id="combo"></div>
  <div id="glowWrap"><div id="glowBar"></div></div>
  <div id="dreamline"></div>
</div>

<div id="overlay" class="show">
  <div class="card">
    <h1>DREAM RAFT</h1>
    <p class="sub">a drift through sleeping seas</p>
    <p>steer with &larr; &rarr; / A D, or drag<br>
    hold <b>space</b> to drift faster &mdash; light burns quicker<br>
    gather fragments of light &middot; avoid the nightmares<br>
    <b>M</b> sound &middot; <b>P</b> pause</p>
    <p class="hint">press any key or tap to begin</p>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
